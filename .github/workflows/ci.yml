name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

# One job, one install. The steps mirror the root `pnpm run ci` script in the
# same order; keep the two in sync (see .ai/decisions/ADR-0003-single-job-ci.md).
# Once Setup succeeds, later steps still run after an earlier check fails so a
# PR surfaces every problem in one run, while the job itself stays red; a
# failed install skips them all instead of producing eleven misleading reds.
# The Docker matrix stays a separate, parallel job because it needs buildx
# rather than the Node toolchain.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        id: setup
        uses: ./tooling/github/setup

      - name: Copy env
        run: cp .env.example .env

      - name: Verify AI contracts are up to date
        run: pnpm ai:contracts:check

      - name: Verify skills bundles are in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm skills:check

      - name: Verify Dockerfile pins and build args
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm docker:check

      - name: Lint design language contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm design:lint

      - name: Check design token drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm design:tokens

      - name: Check UI composition rules
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm ui:composition

      - name: Lint workspace manifests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint:ws

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            smoke: >-
              docker run -d --rm --name smoke -p 3000:3000 -e SKIP_ENV_VALIDATION=1 turbo-web
              && sleep 8
              && curl -fsS -o /dev/null http://localhost:3000/
              && docker stop smoke
          - app: server
            dockerfile: apps/server/Dockerfile
            # Boots the image against a throwaway Postgres: migrations apply,
            # /health answers, and a second migration run is a no-op. The
            # runner must not ship node_modules, pnpm, tsx, or drizzle-kit.
            smoke: >-
              docker run --rm --entrypoint sh turbo-server -c
              '! test -e node_modules && ! command -v pnpm && ! command -v tsx
              && command -v infisical && test -f drizzle/meta/_journal.json'
              && docker network create smoke
              && docker run -d --rm --name pg --network smoke -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16-alpine
              && until docker exec pg pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
              && docker run -d --rm --name smoke --network smoke -p 3001:3001
              -e POSTGRES_URL=postgres://postgres@pg:5432/postgres
              -e AUTH_SECRET=ci-smoke-secret-0123456789abcdef0123456789
              -e RESEND_API_KEY=re_ci_smoke turbo-server
              && for i in $(seq 30); do curl -fsS http://localhost:3001/health && break; sleep 1; done
              && curl -fsS http://localhost:3001/health
              && docker run --rm --network smoke
              -e POSTGRES_URL=postgres://postgres@pg:5432/postgres turbo-server
              node dist/migrate.mjs
              && docker logs smoke
              && docker stop smoke pg
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: turbo-${{ matrix.app }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Smoke test ${{ matrix.app }} image
        run: ${{ matrix.smoke }}

      - name: Report image size
        run: docker image ls turbo-${{ matrix.app }} --format '{{.Repository}} {{.Size}}'
