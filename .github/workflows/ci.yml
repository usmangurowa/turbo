name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  ai-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Verify AI contracts are up to date
        run: pnpm ai:contracts:check

      - name: Verify skills bundles are in sync
        run: pnpm skills:check

      - name: Verify Dockerfile pins and build args
        run: pnpm docker:check

  design-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Lint design language
        run: pnpm design:lint

      - name: Verify design token parity
        run: pnpm design:tokens

      - name: Verify UI composition
        run: pnpm ui:composition

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            smoke: >-
              docker run -d --rm --name smoke -p 3000:3000 -e SKIP_ENV_VALIDATION=1 turbo-web
              && sleep 8
              && curl -fsS -o /dev/null http://localhost:3000/
              && docker stop smoke
          - app: server
            dockerfile: apps/server/Dockerfile
            smoke: >-
              docker run --rm --entrypoint sh turbo-server -c
              'which pnpm tsx drizzle-kit infisical
              && test -f node_modules/@turbo/db/scripts/drizzle.mjs
              && ls node_modules/@turbo/db/drizzle/*.sql'
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: turbo-${{ matrix.app }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Smoke test ${{ matrix.app }} image
        run: ${{ matrix.smoke }}

      - name: Report image size
        run: docker image ls turbo-${{ matrix.app }} --format '{{.Repository}} {{.Size}}'
